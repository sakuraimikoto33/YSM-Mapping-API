name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark each release as a prerelease
        required: true
        default: false
        type: boolean
      draft:
        description: Create each release as a draft
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Select unreleased branches
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.release.outputs.build_matrix }}
      release_matrix: ${{ steps.release.outputs.release_matrix }}
      default_branch: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Select branches whose modVersion is not released
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run the Release workflow from the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

          branch_file=".agents/active-minecraft-branches.txt"
          if [[ ! -f "$branch_file" ]]; then
            echo "::error file=$branch_file::Active Minecraft branch list was not found."
            exit 1
          fi

          mapfile -t branches < <(
            sed \
              -e 's/\r$//' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e '/^$/d' \
              -e '/^#/d' \
              "$branch_file"
          )

          if (( ${#branches[@]} == 0 )); then
            echo "::error file=$branch_file::No active Minecraft branches were listed."
            exit 1
          fi

          build_matrix='[]'
          release_matrix='[]'
          declare -A version_state=()

          for branch in "${branches[@]}"; do
            if [[ ! "$branch" =~ ^mc/[0-9A-Za-z._-]+$ ]]; then
              echo "::error file=$branch_file::Invalid Minecraft branch: $branch"
              exit 1
            fi

            if ! git fetch --quiet --no-tags --depth=1 origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error file=$branch_file::Remote branch does not exist or could not be fetched: $branch"
              exit 1
            fi

            properties="$(git show "refs/remotes/origin/$branch:gradle.properties")"
            mapfile -t mod_versions < <(
              printf '%s\n' "$properties" |
                sed -n 's/^modVersion[[:space:]]*=[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p'
            )
            if (( ${#mod_versions[@]} != 1 )) || [[ -z "${mod_versions[0]}" ]]; then
              echo "::error::$branch must define modVersion exactly once in gradle.properties."
              exit 1
            fi

            mod_version="${mod_versions[0]}"
            if ! git check-ref-format "refs/tags/$mod_version"; then
              echo "::error::$branch has a modVersion that is not a valid Git tag: $mod_version"
              exit 1
            fi

            if [[ -z "${version_state[$mod_version]+present}" ]]; then
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/$mod_version" > /dev/null
              tag_status=$?
              set -e
              if (( tag_status == 0 )); then
                version_state[$mod_version]="released"
              elif (( tag_status == 2 )); then
                version_state[$mod_version]="new"
              else
                echo "::error::Unable to check whether release tag exists: $mod_version"
                exit "$tag_status"
              fi
            fi

            if [[ "${version_state[$mod_version]}" == "released" ]]; then
              echo "::notice::$branch is skipped because tag $mod_version already exists."
              continue
            fi

            version_key="$(printf '%s' "$mod_version" | sha256sum | cut -c1-16)"
            safe_branch="${branch//\//-}"
            build_entry="$(jq -cn \
              --arg branch "$branch" \
              --arg mod_version "$mod_version" \
              --arg version_key "$version_key" \
              --arg safe_branch "$safe_branch" \
              '{branch: $branch, mod_version: $mod_version, version_key: $version_key, safe_branch: $safe_branch}')"
            build_matrix="$(jq -cn --argjson current "$build_matrix" --argjson entry "$build_entry" \
              '$current + [$entry]')"

            if ! jq -e --arg version "$mod_version" \
              'any(.[]; .mod_version == $version)' <<< "$release_matrix" > /dev/null; then
              release_entry="$(jq -cn \
                --arg mod_version "$mod_version" \
                --arg artifact_pattern "release-$version_key-*" \
                '{mod_version: $mod_version, artifact_pattern: $artifact_pattern}')"
              release_matrix="$(jq -cn --argjson current "$release_matrix" --argjson entry "$release_entry" \
                '$current + [$entry]')"
            fi
          done

          if [[ "$(jq 'length' <<< "$build_matrix")" == "0" ]]; then
            echo "::error::Every active Minecraft branch already has a release tag for its modVersion."
            exit 1
          fi

          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          echo "release_matrix=$release_matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }} (${{ matrix.mod_version }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: >-
          ./gradlew --no-daemon
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          build

      - name: Collect release assets
        shell: bash
        env:
          BRANCH_NAME: ${{ matrix.branch }}
          EXPECTED_MOD_VERSION: ${{ matrix.mod_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          minecraft_version="$(sed -n 's/^minecraftVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          mod_version="$(sed -n 's/^modVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          if [[ -z "$minecraft_version" || -z "$mod_version" ]]; then
            echo "::error file=gradle.properties::minecraftVersion or modVersion is missing."
            exit 1
          fi
          if [[ "$mod_version" != "$EXPECTED_MOD_VERSION" ]]; then
            echo "::error file=gradle.properties::$BRANCH_NAME changed modVersion after release selection."
            exit 1
          fi

          mkdir release-assets
          for loader in fabric forge neoforge; do
            if [[ ! -d "$loader" ]]; then
              continue
            fi

            jar="$loader/build/libs/ysm-mapping-api-${loader}-${minecraft_version}-${mod_version}.jar"
            if [[ ! -f "$jar" ]]; then
              echo "::error::Expected loader JAR was not produced: $jar"
              exit 1
            fi
            cp "$jar" release-assets/
          done

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No Fabric, Forge, or NeoForge distribution JAR was produced."
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.version_key }}-${{ matrix.safe_branch }}
          path: release-assets/*.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Release ${{ matrix.mod_version }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact_pattern }}
          path: downloaded-assets

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir release-assets
          while IFS= read -r -d '' file; do
            target="release-assets/$(basename "$file")"
            if [[ -e "$target" ]]; then
              echo "::error::Duplicate release asset name: $(basename "$file")"
              exit 1
            fi
            cp "$file" "$target"
          done < <(find downloaded-assets -type f -name '*.jar' -print0)

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.mod_version }}
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          encoded_tag="$(jq -rn --arg tag "$TAG" '$tag | @uri')"
          set +e
          tag_lookup="$(gh api "repos/$GH_REPO/git/ref/tags/$encoded_tag" 2>&1)"
          tag_status=$?
          set -e
          if (( tag_status == 0 )); then
            echo "::notice::Release $TAG is skipped because its tag was created after preparation."
            exit 0
          fi
          if [[ "$tag_lookup" != *"HTTP 404"* ]]; then
            printf '%s\n' "$tag_lookup" >&2
            exit "$tag_status"
          fi

          assets=(release-assets/*.jar)
          release_args=(
            "$TAG"
            "${assets[@]}"
            --title "$TAG"
            --target "$DEFAULT_BRANCH"
            --generate-notes
          )

          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
