name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark each release as a prerelease
        required: true
        default: false
        type: boolean
      draft:
        description: Create each release as a draft
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Select unreleased branches
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.release.outputs.build_matrix }}
      release_matrix: ${{ steps.release.outputs.release_matrix }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Select branches whose modVersion is not released
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run the Release workflow from the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

          branch_file=".agents/active-minecraft-branches.txt"
          if [[ ! -f "$branch_file" ]]; then
            echo "::error file=$branch_file::Active Minecraft branch list was not found."
            exit 1
          fi

          mapfile -t branches < <(
            sed \
              -e 's/\r$//' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e '/^$/d' \
              -e '/^#/d' \
              "$branch_file"
          )

          if (( ${#branches[@]} == 0 )); then
            echo "::error file=$branch_file::No active Minecraft branches were listed."
            exit 1
          fi

          build_matrix='[]'
          release_matrix='[]'
          declare -A tag_state=()

          for branch in "${branches[@]}"; do
            if [[ ! "$branch" =~ ^mc/[0-9A-Za-z._-]+$ ]]; then
              echo "::error file=$branch_file::Invalid Minecraft branch: $branch"
              exit 1
            fi

            if ! git fetch --quiet --no-tags --depth=1 origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error file=$branch_file::Remote branch does not exist or could not be fetched: $branch"
              exit 1
            fi

            properties="$(git show "refs/remotes/origin/$branch:gradle.properties")"
            mapfile -t mod_versions < <(
              printf '%s\n' "$properties" |
                sed -n 's/^modVersion[[:space:]]*=[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p'
            )
            mapfile -t minecraft_versions < <(
              printf '%s\n' "$properties" |
                sed -n 's/^minecraftVersion[[:space:]]*=[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p'
            )
            if (( ${#mod_versions[@]} != 1 )) || [[ -z "${mod_versions[0]}" ]] ||
              (( ${#minecraft_versions[@]} != 1 )) || [[ -z "${minecraft_versions[0]}" ]]; then
              echo "::error::$branch must define modVersion and minecraftVersion exactly once in gradle.properties."
              exit 1
            fi

            mod_version="${mod_versions[0]}"
            minecraft_version="${minecraft_versions[0]}"
            release_tag="${mod_version}-mc${minecraft_version}"
            if ! git check-ref-format "refs/tags/$release_tag"; then
              echo "::error::$branch produces an invalid release tag: $release_tag"
              exit 1
            fi

            if [[ -z "${tag_state[$release_tag]+present}" ]]; then
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/$release_tag" > /dev/null
              tag_status=$?
              set -e
              if (( tag_status == 0 )); then
                tag_state[$release_tag]="released"
              elif (( tag_status == 2 )); then
                tag_state[$release_tag]="new"
              else
                echo "::error::Unable to check whether release tag exists: $release_tag"
                exit "$tag_status"
              fi
            fi

            if [[ "${tag_state[$release_tag]}" == "released" ]]; then
              echo "::notice::$branch is skipped because tag $release_tag already exists."
              continue
            fi

            target_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            tag_key="$(printf '%s' "$release_tag" | sha256sum | cut -c1-16)"
            safe_branch="${branch//\//-}"
            artifact_name="release-${tag_key}-${safe_branch}"
            build_entry="$(jq -cn \
              --arg branch "$branch" \
              --arg mod_version "$mod_version" \
              --arg minecraft_version "$minecraft_version" \
              --arg release_tag "$release_tag" \
              --arg target_sha "$target_sha" \
              --arg artifact_name "$artifact_name" \
              '{branch: $branch, mod_version: $mod_version, minecraft_version: $minecraft_version, release_tag: $release_tag, target_sha: $target_sha, artifact_name: $artifact_name}')"
            build_matrix="$(jq -cn --argjson current "$build_matrix" --argjson entry "$build_entry" \
              '$current + [$entry]')"

            release_entry="$(jq -cn \
              --arg branch "$branch" \
              --arg mod_version "$mod_version" \
              --arg minecraft_version "$minecraft_version" \
              --arg release_tag "$release_tag" \
              --arg target_sha "$target_sha" \
              --arg artifact_name "$artifact_name" \
              '{branch: $branch, mod_version: $mod_version, minecraft_version: $minecraft_version, release_tag: $release_tag, target_sha: $target_sha, artifact_name: $artifact_name}')"
            release_matrix="$(jq -cn --argjson current "$release_matrix" --argjson entry "$release_entry" \
              '$current + [$entry]')"
          done

          if [[ "$(jq 'length' <<< "$build_matrix")" == "0" ]]; then
            echo "::error::Every active Minecraft branch already has a release tag for its modVersion and minecraftVersion."
            exit 1
          fi

          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          echo "release_matrix=$release_matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }} (${{ matrix.release_tag }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: >-
          ./gradlew --no-daemon
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          build

      - name: Collect release assets
        shell: bash
        env:
          BRANCH_NAME: ${{ matrix.branch }}
          EXPECTED_MOD_VERSION: ${{ matrix.mod_version }}
          EXPECTED_MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          minecraft_version="$(sed -n 's/^minecraftVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          mod_version="$(sed -n 's/^modVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          if [[ -z "$minecraft_version" || -z "$mod_version" ]]; then
            echo "::error file=gradle.properties::minecraftVersion or modVersion is missing."
            exit 1
          fi
          if [[ "$mod_version" != "$EXPECTED_MOD_VERSION" ]]; then
            echo "::error file=gradle.properties::$BRANCH_NAME changed modVersion after release selection."
            exit 1
          fi
          if [[ "$minecraft_version" != "$EXPECTED_MINECRAFT_VERSION" ]]; then
            echo "::error file=gradle.properties::$BRANCH_NAME changed minecraftVersion after release selection."
            exit 1
          fi

          mkdir release-assets
          for loader in fabric forge neoforge; do
            if [[ ! -d "$loader" ]]; then
              continue
            fi

            jar="$loader/build/libs/ysm-mapping-api-${loader}-${minecraft_version}-${mod_version}.jar"
            if [[ ! -f "$jar" ]]; then
              echo "::error::Expected loader JAR was not produced: $jar"
              exit 1
            fi
            cp "$jar" release-assets/
          done

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No Fabric, Forge, or NeoForge distribution JAR was produced."
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Release ${{ matrix.release_tag }} from ${{ matrix.branch }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}

    steps:
      - name: Checkout release history for ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: downloaded-assets

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir release-assets
          while IFS= read -r -d '' file; do
            target="release-assets/$(basename "$file")"
            if [[ -e "$target" ]]; then
              echo "::error::Duplicate release asset name: $(basename "$file")"
              exit 1
            fi
            cp "$file" "$target"
          done < <(find downloaded-assets -type f -name '*.jar' -print0)

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"

      - name: Write commit history link
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
          TARGET_SHA: ${{ matrix.target_sha }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 \
            --match "*-mc${MINECRAFT_VERSION}" "$TARGET_SHA" 2> /dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            encoded_previous="$(jq -rn --arg value "$previous_tag" '$value | @uri')"
            encoded_target="$(jq -rn --arg value "$TARGET_SHA" '$value | @uri')"
            history_url="https://github.com/$GH_REPO/compare/${encoded_previous}...${encoded_target}"
          else
            encoded_target="$(jq -rn --arg value "$TARGET_SHA" '$value | @uri')"
            history_url="https://github.com/$GH_REPO/commits/${encoded_target}"
          fi

          printf '[Full Changelog](%s)\n' "$history_url" > release-notes.md

          cat release-notes.md

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.release_tag }}
          TARGET_BRANCH: ${{ matrix.branch }}
          TARGET_SHA: ${{ matrix.target_sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          encoded_tag="$(jq -rn --arg tag "$TAG" '$tag | @uri')"
          set +e
          tag_lookup="$(gh api "repos/$GH_REPO/git/ref/tags/$encoded_tag" 2>&1)"
          tag_status=$?
          set -e
          if (( tag_status == 0 )); then
            echo "::notice::Release $TAG is skipped because its tag was created after preparation."
            exit 0
          fi
          if [[ "$tag_lookup" != *"HTTP 404"* ]]; then
            printf '%s\n' "$tag_lookup" >&2
            exit "$tag_status"
          fi

          assets=(release-assets/*.jar)
          release_args=(
            "$TAG"
            "${assets[@]}"
            --title "$TAG"
            --target "$TARGET_SHA"
            --notes-file release-notes.md
          )

          echo "Creating tag $TAG at $TARGET_BRANCH ($TARGET_SHA)."

          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
