name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create for the release (for example, v0.1.0)
        required: true
        type: string
      release_name:
        description: Release title (defaults to the tag)
        required: false
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean
      draft:
        description: Create the release as a draft
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Read active Minecraft branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
      default_branch: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read and validate branch list
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          branch_file=".agents/active-minecraft-branches.txt"
          if [[ ! -f "$branch_file" ]]; then
            echo "::error file=$branch_file::Active Minecraft branch list was not found."
            exit 1
          fi

          mapfile -t branches < <(
            sed \
              -e 's/\r$//' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e '/^$/d' \
              -e '/^#/d' \
              "$branch_file"
          )

          if (( ${#branches[@]} == 0 )); then
            echo "::error file=$branch_file::No active Minecraft branches were listed."
            exit 1
          fi

          for branch in "${branches[@]}"; do
            if [[ ! "$branch" =~ ^mc/[0-9A-Za-z._-]+$ ]]; then
              echo "::error file=$branch_file::Invalid Minecraft branch: $branch"
              exit 1
            fi
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
              echo "::error file=$branch_file::Remote branch does not exist: $branch"
              exit 1
            fi
          done

          branches_json="$(printf '%s\n' "${branches[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "branches=$branches_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: >-
          ./gradlew --no-daemon
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          build

      - name: Collect release assets
        id: assets
        shell: bash
        env:
          BRANCH_NAME: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir release-assets
          candidates=(
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
          )

          for file in "${candidates[@]}"; do
            if [[ "$file" == *-sources.jar ]]; then
              continue
            fi
            cp "$file" release-assets/
          done

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No Fabric, Forge, or NeoForge distribution JAR was produced."
            exit 1
          fi

          safe_branch="${BRANCH_NAME//\//-}"
          echo "artifact_name=release-${safe_branch}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.assets.outputs.artifact_name }}
          path: release-assets/*.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Create GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: downloaded-assets

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir release-assets
          while IFS= read -r -d '' file; do
            target="release-assets/$(basename "$file")"
            if [[ -e "$target" ]]; then
              echo "::error::Duplicate release asset name: $(basename "$file")"
              exit 1
            fi
            cp "$file" "$target"
          done < <(find downloaded-assets -type f -name '*.jar' -print0)

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          title="$RELEASE_NAME"
          if [[ -z "$title" ]]; then
            title="$TAG"
          fi

          assets=(release-assets/*.jar)
          release_args=(
            "$TAG"
            "${assets[@]}"
            --title "$title"
            --target "$DEFAULT_BRANCH"
            --generate-notes
          )

          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
